     <script>
          (function () {
               "use strict";
               if (window.__aichatLoaded) return;
               window.__aichatLoaded = true;

               // ⚠️ غيّر الرابط ده برابط الـ Worker بتاعك بعد ما تنشره
               var API_URL = "https://YOUR-WORKER.your-name.workers.dev";

               // 📍 مكان الشات في الصفحة
               var SIDE = "right";       // "right" (يمين) أو "left" (شمال)
               var OFFSET_BOTTOM = 20;   // المسافة من تحت بالبيكسل (ارفعها لو الزرار فوق حاجة زي مشغل الموسيقى)

               var MAX_LEN = 500;        // أقصى طول للرسالة
               var MAX_HISTORY = 12;     // عدد الرسائل المرسلة كسياق
               var TIMEOUT_MS = 25000;   // مهلة انتظار الرد
               var COOLDOWN_MS = 1500;   // أقل فاصل بين رسالتين
               var GREETING = "أهلاً! أقدر أساعدك إزاي النهاردة؟";

               function el(id) { return document.getElementById(id); }
               var btn = el("aichat-btn"), box = el("aichat-box"), msgs = el("aichat-msgs");
               var form = el("aichat-form"), input = el("aichat-input"), send = el("aichat-send");
               var closeBtn = el("aichat-close"), clearBtn = el("aichat-clear");
               if (!btn || !box || !msgs || !form || !input || !send || !closeBtn || !clearBtn) return;

               var side = SIDE === "left" ? "left" : "right";
               var ob = Number(OFFSET_BOTTOM);
               if (!isFinite(ob) || ob < 0) ob = 20;
               btn.setAttribute("data-side", side);
               box.setAttribute("data-side", side);
               btn.style.setProperty("--aichat-b", ob + "px");
               box.style.setProperty("--aichat-b", ob + "px");

               var chat = [];       // سجل المحادثة
               var session = 0;     // بيزيد عند المسح عشان نتجاهل ردود قديمة
               var busy = false;
               var lastSent = 0;

               function add(text, cls) {
                    var d = document.createElement("div");
                    d.className = "aichat-m " + cls;
                    d.textContent = text;          // textContent فقط: مفيش HTML بيتحقن أبداً
                    msgs.appendChild(d);
                    msgs.scrollTop = msgs.scrollHeight;
                    return d;
               }

               function openBox() {
                    box.classList.add("open");
                    btn.setAttribute("aria-expanded", "true");
                    input.focus();
               }
               function closeBox() {
                    box.classList.remove("open");
                    btn.setAttribute("aria-expanded", "false");
                    btn.focus();
               }
               function resetChat() {
                    session++;
                    chat = [];
                    busy = false;
                    send.disabled = false;
                    msgs.textContent = "";
                    add(GREETING, "bot");
               }

               resetChat();

               btn.addEventListener("click", function () {
                    if (box.classList.contains("open")) closeBox(); else openBox();
               });
               closeBtn.addEventListener("click", closeBox);          // خروج في أي وقت
               clearBtn.addEventListener("click", resetChat);         // مسح المحادثة
               document.addEventListener("keydown", function (e) {    // Esc للخروج
                    if (e.key === "Escape" && box.classList.contains("open")) closeBox();
               });

               form.addEventListener("submit", async function (e) {
                    e.preventDefault();
                    if (busy) return;

                    var text = input.value.replace(/\s+/g, " ").trim();
                    if (!text) return;
                    if (text.length > MAX_LEN) text = text.slice(0, MAX_LEN);

                    var now = Date.now();
                    if (now - lastSent < COOLDOWN_MS) return;
                    lastSent = now;

                    input.value = "";
                    add(text, "user");
                    chat.push({ role: "user", content: text });

                    var mySession = session;
                    busy = true;
                    send.disabled = true;
                    var wait = add("...", "bot");

                    var ctrl = new AbortController();
                    var timer = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS);
                    var reply = null, failed = false, failText = "";

                    try {
                         var r = await fetch(API_URL, {
                              method: "POST",
                              mode: "cors",
                              credentials: "omit",
                              headers: { "Content-Type": "application/json" },
                              body: JSON.stringify({ messages: chat.slice(-MAX_HISTORY) }),
                              signal: ctrl.signal
                         });
                         var data = null;
                         try { data = await r.json(); } catch (_) { }
                         var got = data && typeof data.reply === "string" ? data.reply : "";
                         if (r.ok && got) {
                              reply = got;
                         } else {
                              failed = true;
                              failText = got || "حصلت مشكلة، جرّب تاني بعد شوية.";
                         }
                    } catch (err) {
                         failed = true;
                         failText = (err && err.name === "AbortError")
                              ? "الرد اتأخر، جرّب تاني."
                              : "مقدرتش أوصل للسيرفر، جرّب تاني.";
                    } finally {
                         clearTimeout(timer);
                    }

                    if (mySession !== session) return;   // المحادثة اتمسحت أثناء الانتظار

                    busy = false;
                    send.disabled = false;

                    if (failed) {
                         chat.pop();                        // نشيل الرسالة الفاشلة عشان السجل يفضل سليم
                         wait.className = "aichat-m err";
                         wait.textContent = failText;
                    } else {
                         wait.textContent = reply;
                         chat.push({ role: "assistant", content: reply });
                    }
                    msgs.scrollTop = msgs.scrollHeight;
                    if (box.classList.contains("open")) input.focus();
               });
          })();
     </script>
     <!-- ===== نهاية الكود ===== -->
